<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Richard Ranzani</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#60a5fa; }
    }
    body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.6 system-ui,sans-serif; }
    main { max-width:640px; margin:0 auto; padding:12vh 16px; }
    h1 { font-size:2.4rem; margin:0 0 .25em; }
    p { color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Olá, eu sou Richard.</h1>
    <p>Esta é minha página no GitHub Pages.</p>
    <p><a href="https://github.com/">GitHub</a></p>
  </main>
</body>
</html>
